name: Build and Deploy Frontend

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: automata-group/lammah_frontend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_API_URL=https://api.lammah.site
            NEXT_PUBLIC_SITE_URL=https://lammah.site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_SERVER }}
          port: 2222
          script: |
            # Clean space
            docker system prune -f
            
            mkdir -p ~/lammah_frontend
            cd ~/lammah_frontend
            
            cat <<EOF > docker-compose.yml
            services:
              frontend:
                image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                restart: unless-stopped
                ports:
                  - "3001:3000"
            EOF
            
            # Prefer IPv4 over IPv6 to resolve docker pull connection reset issues on GHCR
            if [ -f /etc/gai.conf ]; then
              sudo sed -i 's/#\s*precedence ::ffff:0:0\/96  100/precedence ::ffff:0:0\/96  100/g' /etc/gai.conf || true
            fi

            echo ${{ secrets.GHCR_PAT }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            echo "Pulling latest image with retries..."
            MAX_PULL_RETRIES=5
            PULL_COUNT=0
            until docker compose pull; do
              PULL_COUNT=$((PULL_COUNT+1))
              if [ $PULL_COUNT -eq $MAX_PULL_RETRIES ]; then
                echo "Failed to pull images after $MAX_PULL_RETRIES attempts. Exiting."
                exit 1
              fi
              echo "Pull failed, retrying in 15 seconds ($PULL_COUNT/$MAX_PULL_RETRIES)..."
              sleep 15
            done

            docker compose up -d
